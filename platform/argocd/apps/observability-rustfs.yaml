apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-rustfs
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.rustfs.com/
      chart: rustfs
      targetRevision: 1.0.0
      helm:
        releaseName: rustfs
        valueFiles:
          - $values/platform/observability/rustfs/values.yaml
    - repoURL: https://github.com/aboft/homelab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
