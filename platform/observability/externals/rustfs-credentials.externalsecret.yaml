apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: rustfs-credentials
    creationPolicy: Owner
  data:
    # Key names match what RustFS's chart expects for secret.existingSecret
    # (templates/secret.yaml). Tempo consumes the same Secret via
    # global.extraEnvFrom + -config.expand-env, referencing these same names
    # as ${RUSTFS_ACCESS_KEY}/${RUSTFS_SECRET_KEY} in its s3 config — one
    # 1Password item and one Secret serve both sides.
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: rustfs-tempo-s3/access-key
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: rustfs-tempo-s3/secret-key
