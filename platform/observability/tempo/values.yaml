traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

storage:
  trace:
    backend: s3
    s3:
      # Was tempo's bundled minio subchart; replaced by the standalone
      # observability-rustfs app/release. See platform/observability/rustfs
      # for why (MinIO's images became unpullable, chart offers no way to
      # skip the broken hook jobs that provisioned the old minio's bucket).
      #
      # Credentials are NOT inlined here (this repo is public) — they're
      # ${VAR}-expanded at startup from the same rustfs-credentials Secret
      # RustFS itself consumes (see the s3Env anchor below and
      # platform/observability/rustfs/rustfs-credentials.externalsecret.yaml).
      bucket: tempo
      endpoint: rustfs-svc.monitoring.svc.cluster.local:9000
      access_key: ${RUSTFS_ACCESS_KEY}
      secret_key: ${RUSTFS_SECRET_KEY}
      insecure: true

# Bundled minio subchart disabled — see storage.trace.s3 above.
minio:
  enabled: false

# Shared by every component below that touches the object store directly —
# turns out that's not just distributor/ingester/compactor/querier:
# metrics-generator also writes optional trace-metrics data back to the
# backend, and query-frontend initializes a storage client for search
# sharding in Tempo 2.x. Confirmed by runtime errors, not just reading the
# chart: metrics-generator failed auth with the literal unexpanded string
# "${RUSTFS_ACCESS_KEY}" as its access key before this was added here.
# Only gateway (nginx proxy) and memcached (cache) genuinely don't need it.
# Enables ${VAR} expansion in tempo.yaml and injects the vars
# storage.trace.s3 above references. Chart 1.35.0 has no
# global.extraArgs/extraEnvFrom (added in later chart releases), hence
# setting it per-component via this YAML anchor instead of repeating it 6x.
s3Env: &s3Env
  extraArgs:
    - "-config.expand-env=true"
  extraEnvFrom:
    - secretRef:
        name: rustfs-credentials

metricsGenerator:
  <<: *s3Env
  enabled: true
  config:
    storage:
      path: /var/tempo/wal
      remote_write:
        - url: http://kps-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

gateway:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: tempo.aboft.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: tempo-tls
        hosts:
          - tempo.aboft.dev

distributor:
  <<: *s3Env
  replicas: 1
ingester:
  <<: *s3Env
  replicas: 1
  config:
    replication_factor: 1
querier:
  <<: *s3Env
  replicas: 1
queryFrontend:
  <<: *s3Env
  replicas: 1
compactor:
  <<: *s3Env
  replicas: 1
  config:
    compaction:
      block_retention: 720h
