traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo
      endpoint: tempo-minio.monitoring.svc.cluster.local:9000
      access_key: grafana-tempo
      secret_key: supersecret
      insecure: true

minio:
  serviceAccount:
    create: true
    name: tempo-minio-sa
  enabled: true
  rootUser: grafana-tempo
  rootPassword: supersecret
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
  buckets:
    - name: tempo
      policy: none
      purge: false

compactor:
  config:
    compaction:
      block_retention: 168h

metricsGenerator:
  enabled: true
  config:
    storage:
      path: /var/tempo/wal
      remote_write:
        - url: http://kps-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

gateway:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: tempo.aboft.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: tempo-tls
        hosts:
          - tempo.aboft.dev

distributor:
  replicas: 1
ingester:
  # replication_factor (chart default 3, unchanged) requires a write quorum
  # of 2 live ingesters. This was previously 1 replica against RF 3, so
  # quorum could never be met and every write failed ("at least 2 live
  # replicas required, could only find 1"). 3 k3s nodes are available, so
  # scale to match RF instead of weakening redundancy: real HA, not a
  # workaround.
  replicas: 3
querier:
  replicas: 1
queryFrontend:
  replicas: 1
compactor:
  replicas: 1
